name: Own proof workload (isolated research branch)
on:
  push:
    branches: [research/ci-own-proof-workload-20261126]
permissions:
  contents: read
jobs:
  metrics:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Compile exact own public proof and engine sources (no private kit or Reveal)
        run: |
          set -euo pipefail
          npm exec --yes --package=typescript@5.9.3 -- tsc --target ES2022 --module commonjs --moduleResolution node --strict --skipLibCheck --rootDir . --outDir .research-compiled src/core/types.ts src/core/engine.ts src/content/validator.ts src/help/logic.ts
          echo '{"type":"commonjs"}' > .research-compiled/package.json
          node research-lab/own-proof-workload.mjs
          sha256sum output/OWN_PROOF_WORKLOAD.json
      - uses: actions/upload-artifact@v4
        with:
          name: own-proof-workload
          path: output/OWN_PROOF_WORKLOAD.json
          retention-days: 7
          if-no-files-found: error
