name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Require read-only access to the private pinned kit
        env:
          KIT_READ_TOKEN: ${{ secrets.KIT_READ_TOKEN }}
        run: |
          if [ -z "$KIT_READ_TOKEN" ]; then
            echo '::error::Configure KIT_READ_TOKEN with read-only Contents access to DanilaH/mini-games-kit. No production signing or ad credentials are required for this check.'
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          repository: DanilaH/mini-games-kit
          ref: b1bf2026eda7dd68a5ccbc883946191e03d235af
          path: .test-output/kit
          token: ${{ secrets.KIT_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Pack exact private kit checkout
        working-directory: .test-output/kit
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm pack --ignore-scripts --pack-destination ..
      - name: Install without persisting a repository credential
        run: |
          node tools/use-ci-kit.mjs .test-output/danilah-mini-games-kit-0.2.0-experimental.0.tgz b1bf2026eda7dd68a5ccbc883946191e03d235af
          npm install --no-audit --no-fund
      - run: CONTENT03_REPORT=1 npm run check
      - run: npm run test:league
      - run: node tools/league22-model.mjs
      - run: node tools/league22-guru-model.mjs
      - run: node tools/meta18-economy.mjs
      - run: npm run content:verify
      - name: Verify the isolated content candidate
        run: |
          python3 docs/experiments/content03/verify.py
          python3 docs/experiments/content03/generate.py --out .test-output/content03-repro
          python3 docs/experiments/content03/extend.py --out .test-output/content03-repro
          cmp docs/experiments/content03/banks.json .test-output/content03-repro/banks.json
          cmp docs/experiments/content03/author_solutions.json .test-output/content03-repro/author_solutions.json
          node docs/experiments/content03/long-expressions.mjs
      - run: node .test-output/kit/tools/bootstrap/doctor-game-guidance.mjs . --strict
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build:issuance-pilot && node tools/issuance-pilot-browser.mjs
      - run: npm run build:content-lab && node tools/content03-browser.mjs
      - run: npm run build:league-lab && node tools/league22-browser.mjs && node tools/league22-record.mjs && node tools/meta18-fixtures.mjs && node tools/meta18-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crossmath-ui-evidence
          path: |
            .test-output/ui/
            .test-output/meta-ui/
            .test-output/core00/
            .test-output/issuance16/
            .test-output/content03/
            .test-output/content03-ui/
            .test-output/league22/
            .test-output/league22-guru/
            .test-output/league22-ui/
            .test-output/league22-recording/
            .test-output/meta18/
            .test-output/meta18-ui/
            .test-output/meta18-economy/
            .test-output/help11-ui/
            .test-output/ads-banner/
            .test-output/feel/
      - run: npm run android:sync:release
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"
      - run: ./gradlew --no-daemon assembleDebug assembleReleaseCheck
        working-directory: native/android
      - run: python3 tools/verify-apk.py native/android/app/build/outputs/apk/releaseCheck/app-releaseCheck.apk --kind releasecheck --out .test-output/apk-verification
      - uses: actions/upload-artifact@v4
        with:
          name: crossmath-releasecheck-NOT-PRODUCTION
          path: |
            native/android/app/build/outputs/apk/releaseCheck/app-releaseCheck.apk
            .test-output/apk-verification/
