name: Encrypted research harness transport (isolated)
on:
  push:
    branches: [research/ci-guru-harness-encrypted-20261126]
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          repository: DanilaH/mini-games-kit
          ref: 848d6f2926d89e55c974a49eb348accdec9f1354
          token: ${{ secrets.KIT_READ_TOKEN }}
          path: private-kit
          sparse-checkout: research/games/crossmath
      - name: Encrypt existing research archive to ephemeral recipient (no raw public output)
        run: |
          set -euo pipefail
          umask 077
          mkdir -p output
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          cat > "$tmp/recipient.pem" <<'CERT'
          -----BEGIN CERTIFICATE-----
