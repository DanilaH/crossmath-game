name: Research coverage 621 (lab only)
on:
  push:
    branches: [research/ci-reference-coverage-621-20261126]
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: docs/porting/ADOPTION_LEDGER.json
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v6
        with:
          repository: DanilaH/mini-games-kit
          ref: 703fe422616901ceb86045c6def358ce35b177db
          token: ${{ secrets.KIT_READ_TOKEN }}
          persist-credentials: false
          path: private-kit
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/verify-reference-porting.py
            research/games/crossmath/porting/SOURCE_FEATURES.json
      - name: Verify pinned inventory and exact consumer ledger
        run: |
          set -euo pipefail
          inv=private-kit/research/games/crossmath/porting/SOURCE_FEATURES.json
          ledger=docs/porting/ADOPTION_LEDGER.json
          test "$(git hash-object "$inv")" = a426748dc393101a32e6aec0f2c0ae7b797c8c27
          test "$(git hash-object "$ledger")" = f42791d0312d24816b1a13b3547ed9af659d2d8c
          test "$(git hash-object private-kit/tools/verify-reference-porting.py)" = 8789f8a2c0bee9034597cf9af95368a42bb1f87f
          mkdir -p output
          python3 private-kit/tools/verify-reference-porting.py --inventory "$inv" --ledger "$ledger" > output/COVERAGE.txt
          cat output/COVERAGE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: reference-coverage-621
          path: output/COVERAGE.txt
          retention-days: 7
