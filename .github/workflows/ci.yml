          test "$(git -C private-kit rev-parse HEAD)" = 848d6f2926d89e55c974a49eb348accdec9f1354
          tar -C private-kit -czf "$tmp/research.tar.gz" research/games/crossmath
          openssl cms -encrypt -binary -aes-256-gcm -outform DER -in "$tmp/research.tar.gz" -out output/research.cms "$tmp/recipient.pem"
          test -s output/research.cms
          (cd output && sha256sum research.cms > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: crossmath-encrypted-research-harness
          path: output/
          retention-days: 1
          if-no-files-found: error
