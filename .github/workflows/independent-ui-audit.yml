name: Independent UI UX Feel audit
on:
  push:
    branches: [research/ui-feel-audit-20261128]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: actions/checkout@v6
        with:
          repository: DanilaH/mini-games-kit
          ref: b1bf2026eda7dd68a5ccbc883946191e03d235af
          path: .test-output/kit
          token: ${{ secrets.KIT_READ_TOKEN }}
          persist-credentials: false
      - name: Exact runtime
        working-directory: .test-output/kit
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm pack --ignore-scripts --pack-destination ..
      - run: |
          node tools/use-ci-kit.mjs .test-output/danilah-mini-games-kit-0.2.0-experimental.0.tgz b1bf2026eda7dd68a5ccbc883946191e03d235af
          npm install --no-audit --no-fund
      - run: npx vite build --mode release-candidate
      - run: node tools/meta18-fixtures.mjs
      - run: npx playwright install --with-deps chromium
      - run: node tools/independent-ui-audit.mjs
      - if: always()
        run: |
          python3 -c 'import PIL' || python3 -m pip install --break-system-packages pillow
          python3 tools/independent-ui-montage.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crossmath-independent-ui-audit
          path: .test-output/independent-ui/
