<!doctype html>
<html lang="ru" data-host="browser"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f3e9"><title>Crossmath</title></head><body>
<main id="shell">
<header><button class="word" id="home" type="button" aria-label="Crossmath — на главную"><span class="brand" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Crossmath</button><button class="control" id="pause" type="button">Ⅱ Пауза</button></header>
<section class="progress" aria-label="Прогресс"><span id="wallet"></span><button id="rank" type="button" aria-haspopup="dialog"></button><span class="xp-track" role="progressbar" aria-label="Опыт ранга" id="xp"><i></i></span></section>
<section id="hub" hidden></section>
<section id="play-screen">
<div class="lead"><div><div class="kicker" id="level"></div><h1 id="title"></h1><p id="lives" hidden></p></div><span class="counter" id="filled"></span></div>
<section class="boardpad" aria-label="Арифметическое поле"><div id="game-root" aria-hidden="true"></div><div class="board-scroll"><div class="board" id="board" role="group" aria-label="Пересекающиеся равенства"></div></div></section>
<p class="note" id="note" role="status" aria-live="polite"></p>
<p class="muted" id="run-status" hidden></p>
<section class="traybox" id="traybox" aria-label="Лоток чисел"><div class="trayhead"><h2>Лоток</h2><span class="compact" id="stock"></span></div><div class="tray" id="tray"></div></section>
<div class="tools"><button id="undo" type="button">↶ Отмена</button><button id="return" type="button">В лоток</button><button id="sort" type="button">↕ По порядку</button><button id="help" type="button">Помощь</button></div>
<button class="primary" id="submit" type="button" hidden>Проверить</button>
<section class="hub-panel" id="defeat" hidden><h2>Жизни закончились</h2><p id="defeat-detail">Можно бесплатно начать эту дату заново.</p><button class="primary" id="retry-daily" type="button">Ещё попытка · бесплатно</button><button class="hub-button" id="finish-run" type="button" hidden>Сохранить итог забега</button></section>
<section class="won" id="result" hidden aria-labelledby="result-title"><h2 id="result-title">Поле решено</h2><div id="reward-art"></div><p id="result-rewards"></p><p id="result-detail"></p><details><summary>Прогресс и награды</summary><div id="reward-breakdown"></div></details><button class="primary" id="next" type="button">Следующее поле →</button><button class="hub-button" id="result-replay" type="button">Повторить поле</button></section>
</section>
<section class="error" id="save-error" hidden role="alert"><p id="save-error-text"></p><button id="retry" type="button">Повторить</button><button id="reload" type="button">Восстановить сохранение</button></section>
<p class="storage-note" id="storage-note" role="status"></p>
</main>
<dialog id="pause-dialog" aria-labelledby="pause-title"><h2 id="pause-title">Пауза</h2><p id="mode-rules">Числа сохранены. Продолжите, когда будете готовы.</p><label><input type="checkbox" id="sound">Звуки ходов</label><label><input type="checkbox" id="vibration">Вибрация</label><label><input type="checkbox" id="theme">Тёмная тема</label><label><input type="checkbox" id="reduced">Меньше движения</label><div class="buttons"><button class="primary" id="resume" type="button">Продолжить</button><button class="control" id="restart" type="button">Начать заново</button></div><button class="hub-button" id="end-run" type="button" hidden>Завершить забег и сохранить рекорд</button><button class="hub-button" id="home-from-pause" type="button">На главную</button><section id="restart-confirm" hidden><p id="restart-warning">Начать это поле заново? Поставленные числа вернутся в лоток.</p><div class="buttons"><button id="restart-yes" type="button">Начать заново</button><button id="restart-no" type="button">Оставить партию</button></div></section></dialog>
<dialog id="help-dialog" aria-labelledby="help-title"><h2 id="help-title">Помощь</h2><p id="help-cost"></p><div class="help-choices"><button id="explain" type="button">Объяснить ход</button><button id="reveal" type="button">Показать число</button></div><p id="help-description" role="status"></p><div class="buttons"><button class="primary" id="apply-help" type="button" disabled>Применить</button><button id="close-help" type="button">Продолжить самому</button></div></dialog>
<div class="token ghost" id="ghost" aria-hidden="true" hidden></div>
<dialog id="card-dialog" aria-labelledby="card-title"><h2 id="card-title"></h2><div id="card-body"></div><button class="primary" id="close-card" type="button">Вернуться в альбом</button></dialog>
<section id="startup" role="status"><span>Открываем счётную мастерскую…</span></section>
<script type="module" src="/src/main.ts"></script></body></html>
