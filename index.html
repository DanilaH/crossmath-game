<!doctype html>
<html lang="ru" data-host="browser"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Crossmath</title></head><body>
<main id="shell">
<header id="screen-header">
  <button class="word" id="home" type="button" aria-label="Crossmath — на главную" data-en-label="Crossmath — Home">
    <span class="brand" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="wordmark">Crossmath</span>
    <svg class="play-back" viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>
  </button>
  <h1 id="level" tabindex="-1" hidden></h1>
  <h1 id="deep-title" tabindex="-1" hidden></h1>
  <span id="hub-wallet" hidden></span>
  <button class="control" id="pause" type="button">
    <svg class="play-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg><svg class="hub-settings" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><path d="M8 4v4m8 2v4m-6 2v4"/></svg><span id="pause-label">Пауза</span>
  </button>
</header>
<section class="progress" aria-label="Прогресс" data-en-label="Progress"><span id="wallet"></span><button id="rank" type="button" aria-haspopup="dialog"></button><span class="xp-track" role="progressbar" aria-label="Опыт ранга" data-en-label="Rank XP" id="xp"><i></i></span></section>
<section id="hub" hidden></section>
<nav id="root-tabs" hidden aria-label="Разделы игры" data-en-label="Game sections">
  <button id="tab-home" type="button"><span data-en="Home">Главная</span></button>
  <button id="tab-calendar" type="button"><span data-en="Daily">День</span></button>
  <button id="tab-modes" type="button"><span data-en="Modes">Режимы</span></button>
  <button id="tab-profile" type="button"><span data-en="Profile">Профиль</span></button>
</nav>
<section id="play-screen" aria-labelledby="level">
  <div class="play-stats">
    <p id="play-context" hidden></p>
    <p id="lives" hidden><span id="life-icons" aria-hidden="true"></span><span id="life-count"></span></p>
    <p id="play-time" hidden></p>
    <p id="run-status" hidden></p>
    <p id="run-kind" hidden></p>
  </div>
  <div class="play-area">
  <section class="boardpad" aria-label="Арифметическое поле" data-en-label="Puzzle board">
    <div id="game-root" aria-hidden="true"></div>
    <div class="board-scroll"><div class="board" id="board" role="group" aria-label="Пересекающиеся равенства" data-en-label="Intersecting equations"></div></div>
  </section>
  <p class="note" id="note" role="status" aria-live="polite" aria-atomic="true"></p>
  <section class="traybox" id="traybox" aria-label="Лоток чисел" data-en-label="Number tray"><div class="tray" id="tray"></div>
    <div id="tray-nav" hidden>
      <button id="tray-prev" type="button" aria-label="Предыдущие числа" data-en-label="Previous numbers" aria-controls="tray"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 14 5-5 5 5"/></svg></button>
      <button id="tray-next" type="button" aria-label="Следующие числа" data-en-label="Next numbers" aria-controls="tray"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></button>
    </div>
  </section>
  <div class="tools">
    <button id="undo" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5 3 10l5 5m-5-5h10a5 5 0 0 1 0 10h-2"/></svg><span data-en="Undo">Отмена</span></button>
    <button id="sort" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h13M5 10h10M5 15h7M5 20h4"/></svg><span data-en="Sort">Сортировка</span></button>
    <button id="return" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m-4-4 4 4 4-4M4 16v4h16v-4"/></svg><span data-en="Return to tray">В лоток</span></button>
    <button id="help" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6m-5 3h4M8 14a6 6 0 1 1 8 0c-.7.6-1 1.3-1 2H9c0-.7-.3-1.4-1-2Z"/></svg><span data-en="Help">Помощь</span></button>
  </div>
  </div>
<button class="primary" id="submit" type="button" hidden data-en="Check">Проверить</button>
<section class="hub-panel" id="defeat" hidden><h2 data-en="Out of lives">Жизни закончились</h2><p id="defeat-detail">Можно бесплатно начать эту дату заново.</p><button class="primary" id="retry-daily" type="button">Ещё попытка · бесплатно</button><button class="primary" id="defeat-calendar" type="button" hidden data-en="Back to calendar">В календарь</button><button class="hub-button" id="ad-continue" type="button" hidden>Ещё одна жизнь за видео</button><button class="hub-button" id="finish-run" type="button" hidden data-en="Save run result">Сохранить итог забега</button></section>
<section id="result" class="win-dock" hidden aria-labelledby="result-title">
  <div class="win-copy">
    <h2 id="result-title" tabindex="-1">Поле решено</h2>
    <p id="result-date" hidden></p>
    <p id="result-detail"></p>
    <p id="result-rewards"></p>
  </div>
  <button class="primary" id="next" type="button">Следующее поле</button>
  <button class="primary" id="result-home" type="button" hidden data-en="Home">На главную</button>
  <details id="result-details">
    <summary aria-label="Награды и действия" data-en-label="Rewards and actions"><span aria-hidden="true">⋯</span></summary>
    <div class="win-breakdown">
      <div id="reward-breakdown"></div>
      <button class="win-secondary" id="result-replay" type="button" data-en="Replay">Повторить</button>
    </div>
  </details>
  <div id="workshop-award" hidden></div>
    <button id="instrument-reward" type="button" hidden aria-haspopup="dialog"><span class="instrument-reward-label"></span></button>
  <p id="relax-goal-result" hidden></p>
  <p id="daily-trophy-result" hidden></p>
  <button id="result-main" type="button" data-en="Home">Главная</button>
</section>
</section>
<section class="error" id="save-error" hidden role="alert"><p id="save-error-text"></p><button id="retry" type="button" data-en="Retry">Повторить</button><button id="reload" type="button" data-en="Reload saved game">Восстановить сохранение</button></section>
<p class="storage-note" id="storage-note" role="status"></p>
</main>
<dialog id="pause-dialog" aria-labelledby="pause-title">
  <h2 id="pause-title">Пауза</h2>
  <p id="pause-date" hidden></p>
  <div class="pause-actions">
    <button class="primary" id="resume" type="button" autofocus>Продолжить</button>
    <button class="hub-button" id="home-from-pause" type="button" data-en="Home">На главную</button>
    <button class="hub-button" id="end-run" type="button" hidden data-en="End run and save result">Завершить забег и сохранить рекорд</button>
  </div>
  <details id="settings-options">
    <summary data-en="Settings">Настройки</summary>
    <label><input type="checkbox" id="sound"><span data-en="Move sounds">Звуки ходов</span></label>
    <label><input type="checkbox" id="vibration"><span data-en="Vibration">Вибрация</span></label>
    <label><input type="checkbox" id="theme"><span data-en="Workshop dark theme">Тёмная тема «Мастерская»</span></label>
    <label><input type="checkbox" id="reduced"><span data-en="Reduced motion">Меньше движения</span></label>
    <label><input type="checkbox" id="timer-visible"><span data-en="Show timer in Campaign and Free Play">Таймер в кампании и свободной игре</span></label>
    <label for="language"><span data-en="Language">Язык</span><select id="language"><option value="ru">Русский</option><option value="en">English</option></select></label>
  </details>
  <details id="rules-options">
    <summary data-en="Mode rules">Правила режима</summary>
    <p id="mode-rules"></p>
  </details>
  <button class="control" id="restart" type="button">Начать заново</button>
  <section id="restart-confirm" hidden>
    <p id="restart-warning">Начать это поле заново? Поставленные числа вернутся в лоток.</p>
    <div class="buttons"><button id="restart-no" type="button" data-en="Keep this board">Оставить партию</button><button id="restart-yes" type="button" data-en="Restart">Начать заново</button></div>
  </section>
</dialog>
<dialog id="end-run-dialog" aria-labelledby="end-run-title">
  <h2 id="end-run-title"></h2>
  <div class="buttons">
    <button id="end-run-no" type="button" autofocus data-en="Keep playing">Продолжить игру</button>
    <button id="end-run-yes" type="button" data-en="End run">Завершить забег</button>
  </div>
</dialog>
<dialog id="help-dialog" aria-labelledby="help-title">
  <div id="help-content">
    <h2 id="help-title"><span data-en="Help">Помощь</span></h2>
    <div class="help-choices">
      <button id="explain" type="button" data-en="Explain a move">Объяснить ход</button>
      <button id="reveal" type="button" data-en="Reveal a number">Показать число</button>
    </div>
    <div class="help-payment">
      <p id="help-cost"></p><p id="help-shortage" role="status" hidden></p><p id="help-impact" hidden></p>
      <button class="hub-button" id="ad-hint" type="button" hidden>Кредит подсказки за видео</button>
    </div>
    <p id="help-description" role="status" hidden></p>
  </div>
  <div class="buttons"><button id="close-help" type="button" autofocus data-en="Back to board">К полю</button><button class="primary" id="apply-help" type="button" aria-describedby="help-impact help-cost" disabled data-en="Apply">Применить</button></div>
</dialog>
<div class="token ghost" id="ghost" aria-hidden="true" hidden></div>
<dialog id="game-choice" aria-labelledby="game-choice-title">
  <h2 id="game-choice-title"></h2>
  <div id="game-choice-options" class="mode-options"></div>
  <button id="game-choice-close" class="hub-button" type="button" data-en="Cancel">Отмена</button>
</dialog>
<dialog id="replace-dialog" aria-labelledby="replace-title" aria-describedby="replace-description">
  <h2 id="replace-title"></h2>
  <p id="replace-description"></p>
  <p id="replace-error" role="alert" hidden data-en="The change could not be saved. Try again or keep your board.">Не удалось сохранить замену. Повторите или оставьте партию.</p>
  <div class="buttons">
    <button class="primary" id="keep-board" type="button" autofocus data-en="Keep this board">Оставить партию</button>
    <button class="control" id="replace-board" type="button" data-en="Replace this board">Заменить партию</button>
  </div>
  <button class="hub-button" id="replace-reload" type="button" hidden data-en="Reload saved game">Восстановить сохранение</button>
</dialog>
<dialog id="card-dialog" aria-labelledby="card-title"><h2 id="card-title"></h2><div id="card-body"></div><button class="primary" id="close-card" type="button">Вернуться в альбом</button></dialog>
<section id="startup" role="status"><span data-en="Loading Crossmath…">Загружаем Crossmath…</span></section>
<script type="module" src="/src/main.ts"></script></body></html>
