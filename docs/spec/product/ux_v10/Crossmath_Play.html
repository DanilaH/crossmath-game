<style>

<header><span class="word"><span class="brand" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Crossmath</span><button class="control" id="pause">Ⅱ &nbsp;Пауза</button></header>

"y":6},{"id":10,"x":0,"y":8,"given":15},{"id":11,"x":2,"y":8},{"id":12,"x":4,"y":8},{"id":13,"x":6,"y":8,"given":2},{"id":14,"x":8,"y":8,"given":52},{"id":15,"x":0,"y":10},{"id":16,"x":2,"y":10,"given":3}],"equations":[{"cells":[5,9,12],"op":"*"},{"cells":[7,8,9],"op":"/"},{"cells":[7,10,15],"op":"+"},{"cells":[4,5,6],"op":"-"},{"cells":[8,11,16],"op":"/"},{"cells":[0,1,6],"op":"/"},{"cells":[1,2,3],"op":"+"},{"cells":[12,13,14],"op":"*"}],"tray":[2,27,13,6,2,12,26,4,44,41],"puzzleId":"cm-own-01-025","contentVersion":1,"rulesetVersion":"cm-integer-1","difficulty":"expert","campaignPosition":25,"origin":"crossmath-original-20261118","decisionTags":["direct_inverse","direct_result","intersection","tray"]}];

const $=id=>document.getElementById(id);

let index=3,b,places=new Map(),history=[],selected=null,won=false,gesture=null,context=null,cellNodes=new Map(),opNodes=[],fresh=null;

function sizeBoard(){const pad=document.querySelector('.boardpad');const maxWidth=pad.clientWidth-(b.width>7?2:12);

 const hit=Math.min(48,step*2);const s=$('board').style;
 for(const [k,v] of Object.entries({step,item:Math.min(46,step*1.13),hit}))s.setProperty('--'+k,v+'px');
 s.setProperty('--w',b.width);s.setProperty('--h',b.height)}
function node(tag,cl,x,y){const e=document.createElement(tag);e.className='part '+cl;e.style.setProperty('--x',x);e.style.setProperty('--y',y);return e}
function build(){
 b=boards[index];places=new Map();history=[];selected=null;won=false;fresh=null;cancel();cellNodes=new Map();opNodes=[];$('board').replaceChildren();$('tray').replaceChildren();$('scene').value=index;
 for(const c of b.cells){const fixed=c.given!==undefined;const e=node(fixed?'span':'button',fixed?'given':'cell',c.x,c.y);cellNodes.set(c.id,e);
 if(fixed)e.textContent=c.given;else{e.dataset.cell=c.id;const t=document.createElement('span');t.className='tile';e.append(t)}
 $('board').append(e)}
 for(const eq of b.equations){const parts=eq.cells.map(id=>b.cells.find(c=>c.id===id));const ops=[];
 for(let i=0;i<2;i++){const a=parts[i],n=parts[i+1],e=node('span','op',(a.x+n.x)/2,(a.y+n.y)/2);
 e.textContent=i?'=':glyph[eq.op];e.setAttribute('aria-hidden','true');$('board').append(e);ops.push(e)}opNodes.push(ops)}
 for(let i=0;i<b.tray.length;i++){const slot=document.createElement('span');slot.className='slot';const e=document.createElement('button');e.className='token';e.dataset.token=i;e.textContent=b.tray[i];e.setAttribute('aria-label','Число '+b.tray[i]+', место '+(i+1));slot.append(e);$('tray').append(slot)}
 $('level').textContent='ПОЛЕ '+b.puzzleId.split('-').at(-1).replace(/^0+/,'');$('title').textContent=titles[index];sizeBoard();render()}
function render(message){
 const wasFocused=document.activeElement;const states=b.equations.map(evaluate);
 const bad=new Set(),linked=new Set();b.equations.forEach((eq,i)=>{if(states[i]===false)eq.cells.forEach(id=>bad.add(id));

 for(const c of b.cells){const el=cellNodes.get(c.id);el.classList.toggle('linked',linked.has(c.id));el.classList.toggle('invalid',bad.has(c.id));

 if(!g.drag){g.drag=true;cue('pick');$('ghost').textContent=g.src.kind==='token'?b.tray[g.src.id]:value(g.src.id);$('ghost').hidden=false}
 $('ghost').style.left=e.clientX+'px';$('ghost').style.top=e.clientY+'px';clearHover();const t=dropAt(e.clientX,e.clientY);if(t?.kind==='cell')cellNodes.get(t.id).classList.add('hover');if(t?.kind==='return'&&g.src.kind==='cell')$('traybox').classList.add('hover')});
document.addEventListener('pointerup',e=>{const g=gesture;if(!g||g.pointer!==e.pointerId)return;const drop=dropAt(e.clientX,e.clientY),under=target(document.elementFromPoint(e.clientX,e.clientY));if(g.drag&&(!drop||drop.kind==='return'&&g.src.kind==='token'))glideBack(g);cancel();
 if(g.drag){if(drop)transfer(g.src,drop)}else if(under?.kind===g.src.kind&&under.id===g.src.id)tap(g.src)});
document.addEventListener('pointercancel',e=>{if(gesture?.pointer===e.pointerId)cancel()});document.addEventListener('lostpointercapture',e=>{if(gesture?.pointer===e.pointerId)cancel()});
document.addEventListener('click',e=>{if(e.detail===0){const t=target(e.target);if(t)tap(t)}});
$('back').onclick=()=>transfer(selected,{kind:'return'});$('undo').onclick=()=>{if(!history.length||won)return;cancel();places=history.pop();selected=null;fresh=null;cue('back');render('Ход отменён.')};
$('pause').onclick=()=>{cancel();$('options').showModal()};$('resume').onclick=()=>$('options').close();$('reset').onclick=()=>{$('options').close();build()};
$('dark').onchange=()=>document.body.classList.toggle('dark',$('dark').checked);$('calm').onchange=()=>document.body.classList.toggle('calm',$('calm').checked);
$('scene').onchange=()=>{index=+$('scene').value;build()};$('next').onclick=()=>{index=(index+1)%boards.length;build();$('pause').focus({preventScroll:true});window.scrollTo(0,0)};
boards.forEach((v,i)=>$('scene').add(new Option(v.puzzleId.split('-').at(-1).replace(/^0+/,'')+' · '+titles[i],i)));
window.addEventListener('resize',()=>{cancel();sizeBoard()});window.addEventListener('blur',cancel);document.addEventListener('visibilitychange',()=>{if(document.hidden)cancel()});build();
